<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sem ligação</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f3ff; color: #3b0764;
    display: flex; align-items: center; justify-content: center; min-height: 100dvh; margin: 0; }
  .box { text-align: center; padding: 2rem; }
  .icon { font-size: 3rem; }
  button { margin-top: 1.5rem; background: #6d28d9; color: #fff; border: 0;
    border-radius: 12px; padding: 14px 28px; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📶</div>
    <h1>Sem ligação à internet</h1>
    <p>Os valores que já escreveu estão guardados neste telemóvel.<br />
       Quando a ligação voltar, abra a app e submeta.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
